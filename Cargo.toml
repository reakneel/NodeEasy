[workspace]
resolver = "2"
members = ["crates/nodeeasy-core", "crates/nodeeasy-app"]

[workspace.package]
version = "3.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
